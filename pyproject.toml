[project]
name = "preston-ai-chatbot"
version = "0.1.0"
description = "A production-oriented enterprise AI chatbot platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi",
    "html5lib==1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings",
    "pymysql[rsa]==1.2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "ruff",
    "types-html5lib>=1.1.11.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/preston"]

[tool.ruff]
target-version = "py312"
src = ["backend"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
include = ["backend", "tests", "scripts"]
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
